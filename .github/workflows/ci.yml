name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml lo invoca como job reusable para no publicar binarios si algo falla.
  workflow_call:

# Los binarios de release.yml no deben publicarse si el typecheck o los tests fallan:
# el workflow de release depende de este.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test
