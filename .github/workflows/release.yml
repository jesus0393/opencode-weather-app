name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Un solo run a la vez: si dos pushes a main se solapan, el segundo
# encontraría el tag ya creado a medio push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::package.json no tiene campo 'version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe, se reutiliza"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build:
    name: Build ${{ matrix.asset_name }}
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            built_name: weather
            asset_name: weather-linux-x64
          - os: macos-latest
            built_name: weather
            asset_name: weather-macos-arm64
          - os: windows-latest
            built_name: weather.exe
            asset_name: weather-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Rename binary
        shell: bash
        env:
          BUILT_NAME: ${{ matrix.built_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mv "$BUILT_NAME" "$ASSET_NAME"
          chmod +x "$ASSET_NAME" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Release ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*